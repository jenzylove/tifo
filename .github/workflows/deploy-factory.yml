name: deploy factory
# Deploys a new TifoFactory with the same agent and operator as the previous one, then checks it on chain.
# Run by hand. The deployer only pays gas; a factory has no owner, so the deployer gets no power over it.
on:
  workflow_dispatch:
    inputs:
      network:
        description: testnet or mainnet
        default: testnet
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test
        working-directory: contracts
        run: forge test
      - name: Deploy
        working-directory: contracts
        env:
          NETWORK: ${{ inputs.network }}
          DEPLOYER_PK: ${{ secrets.PRACTICE_FUNDER_PK }}
        run: |
          set -e
          if [ "$NETWORK" = "mainnet" ]; then RPC=https://rpc.mainnet.arc.io; OLD=0x9cda0b646353dAc380156dAedc30892323876CEE;
          else RPC=https://rpc.testnet.arc.io; OLD=0x304794174DD2f795055bd3B43B6757fd0F72bC3A; fi
          USDC=0x3600000000000000000000000000000000000000
          AGENT=$(cast call $OLD "agent()(address)" --rpc-url $RPC)
          OPERATOR=$(cast call $OLD "operator()(address)" --rpc-url $RPC)
          echo "::notice::$NETWORK agent $AGENT operator $OPERATOR (copied from $OLD)"
          OUT=$(forge create src/TifoFactory.sol:TifoFactory --rpc-url $RPC --private-key $DEPLOYER_PK --broadcast --constructor-args $USDC $AGENT $OPERATOR 2>&1) || { echo "::error::$(echo "$OUT" | tail -5 | tr '\n' ' ')"; exit 1; }
          echo "$OUT" | tail -4
          ADDR=$(echo "$OUT" | grep -oE "Deployed to: 0x[0-9a-fA-F]{40}" | grep -oE "0x[0-9a-fA-F]{40}")
          TX=$(echo "$OUT" | grep -oE "Transaction hash: 0x[0-9a-fA-F]{64}" | grep -oE "0x[0-9a-fA-F]{64}")
          BLOCK=$(cast receipt $TX blockNumber --rpc-url $RPC)
          test "$(cast call $ADDR "agent()(address)" --rpc-url $RPC)" = "$AGENT"
          test "$(cast call $ADDR "operator()(address)" --rpc-url $RPC)" = "$OPERATOR"
          echo "::notice::$NETWORK factory $ADDR block $BLOCK tx $TX"
