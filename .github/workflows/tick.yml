name: agent tick
# Keeps the agent awake. One run calls the app every two minutes for about five hours, then starts the next run.
# Each call settles what is due: propose results once two sources agree, finalize after the correction window,
# push refunds, return leftover reserve. About once an hour the call also lets the agent plan each seller's next drop.
# GitHub delays scheduled runs by hours, so the schedule below is only a restart if the chain of runs ever breaks.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: agent-tick
  cancel-in-progress: false
permissions:
  actions: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Call /api/tick every two minutes
        env:
          TIFO_URL: ${{ secrets.TIFO_URL }}
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          PRACTICE_URL: ${{ secrets.PRACTICE_URL }}
          PRACTICE_TICK_SECRET: ${{ secrets.PRACTICE_TICK_SECRET }}
        run: |
          end=$(( $(date +%s) + 5 * 3600 + 15 * 60 ))
          path="/api/tick?plan=1"
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -sS -m 240 -H "Authorization: Bearer $TICK_SECRET" "$TIFO_URL$path" | head -c 2000 || true
            echo
            # The practice version (testnet) settles the same way, when it is set up.
            if [ -n "$PRACTICE_URL" ]; then
              curl -sS -m 240 -H "Authorization: Bearer ${PRACTICE_TICK_SECRET:-$TICK_SECRET}" "$PRACTICE_URL/api/tick" | head -c 1000 || true
              echo
            fi
            # Plan each seller's next drop about once an hour; settle on every call.
            n=$(( ${n:-0} + 1 ))
            if [ $(( n % 30 )) -eq 0 ]; then path="/api/tick?plan=1"; else path="/api/tick"; fi
            sleep 120
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tick.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
