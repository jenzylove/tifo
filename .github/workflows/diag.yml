name: wallet diagnostics
# Read-only: prints the latest refused-wallet reports the site collected at /api/diag (addresses, public keys,
# browser names and error text; nothing secret).
on: workflow_dispatch
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          TICK_SECRET: ${{ secrets.TICK_SECRET }}
          TIFO_URL: ${{ secrets.TIFO_URL }}
        run: |
          curl -sS -m 60 -H "Authorization: Bearer $TICK_SECRET" "${TIFO_URL:-https://tifo.vercel.app}/api/diag" > r.json
          jq -c '.reports[:9][] | {at, stage, credentialId, savedCredentialId, assertion: (.assertion|tostring|.[0:500]), publicKey: (.publicKey // "" | .[0:140]), factory: .op.factory, fd: (.op.factoryData // "" | .[0:300])}' r.json | while read -r l; do echo "::notice::$l"; done
